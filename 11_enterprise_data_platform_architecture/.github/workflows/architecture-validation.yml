name: Architecture Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          pip install -e reference_implementation
      - name: Compile and lint reference implementation
        run: |
          python -m compileall reference_implementation/src
          ruff check reference_implementation/src reference_implementation/tests tests
      - name: Test architecture and executable patterns
        run: pytest -q tests reference_implementation/tests
      - name: Validate Terraform formatting
        uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/terraform
      - name: Run reference pipeline
        run: enterprise-platform-demo --config reference_implementation/config/sample_pipeline.json

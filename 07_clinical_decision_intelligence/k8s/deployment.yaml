apiVersion: apps/v1
kind: Deployment
metadata: {name: cdi-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: cdi-api}}
  template:
    metadata: {labels: {app: cdi-api}}
    spec:
      containers:
      - name: api
        image: ghcr.io/your-org/clinical-decision-intelligence:latest
        ports: [{containerPort: 8000}]
        env:
        - name: CDI_API_KEY
          valueFrom: {secretKeyRef: {name: cdi-secrets, key: api-key}}
        readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 10}
        livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 20}
        resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 2Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: cdi-api}
spec:
  selector: {app: cdi-api}
  ports: [{port: 80, targetPort: 8000}]

services:
  streamlit:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8501:8501"
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: uvicorn pharma_genai.api.service:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

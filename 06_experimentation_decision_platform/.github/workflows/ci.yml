name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-all.txt
      - run: ruff check .
      - run: python -m compileall api scripts src tests
      - run: mypy api src --ignore-missing-imports
      - run: API_KEY=ci-test-secret pytest -q --cov=src --cov=api --cov-report=term-missing
      - run: bandit -q -r api scripts src
      - run: pip-audit -r requirements.txt -r requirements-api.txt
  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t experimentation-platform:${{ github.sha }} .
      - run: docker run -d --name experimentation-api -p 8000:8000 -e API_KEY=ci-test-secret experimentation-platform:${{ github.sha }}
      - run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          docker logs experimentation-api
          exit 1
      - run: |
          curl --fail -X POST http://127.0.0.1:8000/v1/analyze/conversion \
            -H 'Content-Type: application/json' -H 'X-API-Key: ci-test-secret' \
            -d '{"treatment":{"conversions":60,"observations":100},"control":{"conversions":50,"observations":100}}'

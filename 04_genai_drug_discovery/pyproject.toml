[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-genai-drug-discovery"
version = "2.0.0"
description = "Portfolio-grade pharmaceutical GenAI drug discovery with ADMET, toxicity, RDKit features, and reliability scoring"
requires-python = ">=3.9"
dependencies = ["pandas>=1.5", "numpy>=1.23", "scikit-learn>=1.2", "streamlit>=1.28"]

[tool.setuptools.packages.find]
include = ["pharma_genai*"]

name: CI
on: [pull_request, push]
permissions: {contents: read}
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt -r requirements-api.txt -r requirements-dev.txt -e .
      - run: ruff check .
      - run: python -m compileall src scripts tests
      - run: mypy src --ignore-missing-imports
      - env: {EAK_API_KEY: ci-secret}
        run: pytest --cov=enterprise_ai_agent --cov-report=term-missing
      - run: bandit -q -r src
      - run: pip-audit -r requirements.txt -r requirements-api.txt
  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t enterprise-ai-agent:${{ github.sha }} .

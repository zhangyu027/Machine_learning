name: Experimentation Decision Platform CI

on:
  push:
    branches: [main]
    paths:
      - "06_experimentation_decision_platform/**"
      - ".github/workflows/experimentation-platform-ci.yml"
  pull_request:
    paths:
      - "06_experimentation_decision_platform/**"
      - ".github/workflows/experimentation-platform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 06_experimentation_decision_platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            06_experimentation_decision_platform/requirements.txt
            06_experimentation_decision_platform/requirements-api.txt
            06_experimentation_decision_platform/requirements-dev.txt
            06_experimentation_decision_platform/requirements-all.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-all.txt
      - run: ruff check .
      - run: python -m compileall api scripts src tests
      - run: mypy api src --ignore-missing-imports
      - run: python -m pytest -q --cov=src --cov=api --cov-report=term-missing
        env:
          API_KEY: ci-test-secret
      - run: bandit -q -r api scripts src
      - run: pip-audit -r requirements.txt -r requirements-api.txt

  container:
    name: Docker API smoke test
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t experimentation-platform:ci ./06_experimentation_decision_platform
      - name: Start API container
        run: docker run -d --name experimentation-api -p 8000:8000 -e API_KEY=ci-test-secret experimentation-platform:ci
      - name: Check health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs experimentation-api
          exit 1
      - name: Check authenticated conversion analysis
        run: |
          curl --fail --show-error --silent -X POST http://127.0.0.1:8000/v1/analyze/conversion \
            -H 'Content-Type: application/json' -H 'X-API-Key: ci-test-secret' \
            -d '{"treatment":{"conversions":60,"observations":100},"control":{"conversions":50,"observations":100}}'
      - name: Show container logs on failure
        if: failure()
        run: docker logs experimentation-api || true

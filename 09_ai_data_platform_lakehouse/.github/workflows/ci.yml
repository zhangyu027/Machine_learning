name: Project 09 CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 09_ai_data_platform_lakehouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: python -m pip install --upgrade pip && pip install -r requirements-all.txt
      - run: ruff check .
      - run: mypy src --ignore-missing-imports
      - run: python -m compileall src scripts app
      - run: pytest -q --cov=ai_data_platform_lakehouse --cov-report=term-missing
      - run: python -m scripts.run_pipeline
      - run: bandit -q -r src scripts
      - run: pip-audit -r requirements.txt
  container:
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 09_ai_data_platform_lakehouse
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ai-data-platform-lakehouse:${{ github.sha }} .

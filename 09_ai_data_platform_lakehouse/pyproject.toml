[build-system]
requires=["setuptools>=65","wheel"]
build-backend="setuptools.build_meta"
[project]
name="ai-data-platform-lakehouse"
version="3.0.0"
description="Production-oriented synthetic AI data platform and lakehouse reference implementation"
requires-python=">=3.10"
[tool.setuptools]
package-dir={""="src"}
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-ra"
[tool.ruff]
target-version="py310"
line-length=100
[tool.ruff.lint]
select=["E","F","I","B","UP"]
[tool.mypy]
python_version="3.10"
ignore_missing_imports=true

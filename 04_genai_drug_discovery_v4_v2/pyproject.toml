[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-genai-drug-discovery-v4"
version = "4.1.0"
description = "Scientific ML drug discovery platform for scaffold-aware ADMET benchmarking, uncertainty, applicability domains, evidence support, and reproducible deployment."
authors = [{name = "Yu Zhang"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=1.5",
  "numpy>=1.23",
  "scikit-learn>=1.2",
  "requests>=2.31",
  "pydantic>=2.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.28", "plotly>=5.18"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
full = ["torch>=2.1", "torch-geometric>=2.4", "shap>=0.44", "mlflow>=2.9", "biopython>=1.81", "sentence-transformers>=2.2", "faiss-cpu>=1.7.4"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["pharma_genai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

apiVersion: apps/v1
kind: Deployment
metadata: {name: healthcare-mm-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: healthcare-mm-api}}
  template:
    metadata: {labels: {app: healthcare-mm-api}}
    spec:
      containers:
        - name: api
          image: healthcare-mm:v2
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: "500m", memory: "1Gi", nvidia.com/gpu: "0"}
            limits: {cpu: "2", memory: "4Gi", nvidia.com/gpu: "1"}
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: healthcare-mm-api}
spec:
  selector: {app: healthcare-mm-api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: healthcare-mm-api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: healthcare-mm-api}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}

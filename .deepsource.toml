
version = 1

exclude_patterns = [
  "**/venv/**",
  "**/.venv/**",
  "**/__pycache__/**",
  "**/outputs/**",
  "**/output/**",
  "**/vector_store/**",
  "**/vector_store_eval/**"
]

test_patterns = [
  "**/tests/**",
  "**/test_*.py"
]

[[analyzers]]
name = "python"
enabled = true

  [analyzers.meta]
  runtime_version = "3.x.x"

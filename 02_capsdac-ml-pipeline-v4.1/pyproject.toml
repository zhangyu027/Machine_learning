[project]
name = "capsdac-ml-platform-v4"
version = "4.0.0"
description = "CAPSDAC 12-month site-level forecasting and decision-science platform with privacy-safe aggregation, temporal validation, monitoring, registry, API, and dashboard."
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "numpy",
  "scikit-learn",
  "joblib",
  "pyyaml",
  "matplotlib",
  "fastapi",
  "uvicorn",
  "streamlit",
]

[tool.pytest.ini_options]
pythonpath = ["forecasting", "."]
testpaths = ["tests"]
